# Render Blueprint: dashboard.render.com -> New -> Blueprint -> pick this repository.
# The tracker peaked at ~1.8 GB of memory in testing (with TRACKER_MODEL_RES=192x256),
# so it needs an instance with 2 GB RAM ("standard"); smaller plans run out of memory.
services:
  - type: web
    name: object-tracker
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: MAX_SECONDS
        value: "10"
      - key: MAX_SIDE
        value: "384"
      - key: TRACKER_MODEL_RES
        value: "192x256"
