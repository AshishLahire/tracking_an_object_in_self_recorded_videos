[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "object-tracker"
version = "0.3.0"
description = "Track user-selected objects in self-recorded videos with CoTracker3"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["gradio>=5,<6", "imageio-ffmpeg>=0.5", "pandas>=1.5"]
dev = ["pytest>=7", "jupyter"]

[project.scripts]
object-tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
